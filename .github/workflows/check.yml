name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tools/verification-requirements.txt pytest
      # The sparse envytools cache has no nvbios/. The decoder source comes from a full
      # checkout at the same pin (task S1B, tools/restore_verification_refs.py).
      - name: Full envytools checkout for the decoder source
        run: |
          pin=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import restore_verification_refs as r; print(r.manifest_pins()['envytools'])")
          git clone -q https://github.com/envytools/envytools.git "$RUNNER_TEMP/envytools"
          git -C "$RUNNER_TEMP/envytools" checkout -q --detach "$pin"
      - name: Restore the pinned reference sources
        run: K40_REFS="$RUNNER_TEMP/refs" K40_ENVYTOOLS_FULL="$RUNNER_TEMP/envytools" make refs
      # The VBIOS image of the card is private and not in CI. Task A3 checks need it,
      # and tests/test_devinit_rom.py reports NOT RUN when K40_CI_NO_VBIOS=1.
      - run: echo A3 > .check-skip
      - run: K40_ENVYTOOLS_FULL="$RUNNER_TEMP/envytools" make check
        env:
          K40_CI_NO_VBIOS: "1"
      - run: make vm-tools-test
